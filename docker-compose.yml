services:
  payload:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - MINIPROGRAM_TOKEN_SECRET=${MINIPROGRAM_TOKEN_SECRET}
      - PAYLOAD_DB_PUSH=${PAYLOAD_DB_PUSH:-false}
      - DATABASE_URI=${DATABASE_URI:?Set DATABASE_URI in the root .env file}
      - PAYLOAD_PUBLIC_SERVER_URL=${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:3000}
      - WECHAT_AUTH_MODE=${WECHAT_AUTH_MODE:-wechat}
      - WECHAT_APPID=${WECHAT_APPID}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET}
      - WECHAT_CODE_ENV_VERSION=${WECHAT_CODE_ENV_VERSION:-release}
    restart: unless-stopped
    volumes:
      - payload-media:/app/media

volumes:
  payload-media: