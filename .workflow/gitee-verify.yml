version: "1.0"
name: gitee-verify
displayName: Build and deploy via Tencent CCR
stages:
  - name: build
    displayName: Build and upload image
    strategy: naturally
    trigger: auto
    steps:
      - step: image-build-plus@buildkitd
        name: build-app
        displayName: Build application image
        dockerCerts:
          - uuid: tencent-ccr-zhaoshang
        tag: "ccr.ccs.tencentyun.com/jinyi_zhaoshang/wechat_app:${GITEE_COMMIT}"
        dockerfile: backend/Dockerfile
        context: backend
        artifacts: []
        isCache: true
        processorType:
          - amd64
        parameter:
          NODE_IMAGE: m.daocloud.io/docker.io/library/node:24-alpine
          ALPINE_MIRROR: https://mirrors.tuna.tsinghua.edu.cn/alpine
          PNPM_CONFIG_REGISTRY: https://registry.npmmirror.com
        strategy:
          retry: "0"
          timeout: 15
          resource:
            cpu: "4"
            memory: "8"
      - step: image-build-plus@buildkitd
        name: build-tools
        displayName: Build maintenance image
        dockerCerts:
          - uuid: tencent-ccr-zhaoshang
        tag: "ccr.ccs.tencentyun.com/jinyi_zhaoshang/wechat_app-tools:${GITEE_COMMIT}"
        dockerfile: backend/Dockerfile
        context: backend
        artifacts: []
        isCache: true
        processorType:
          - amd64
        parameter:
          NODE_IMAGE: m.daocloud.io/docker.io/library/node:24-alpine
          ALPINE_MIRROR: https://mirrors.tuna.tsinghua.edu.cn/alpine
          PNPM_CONFIG_REGISTRY: https://registry.npmmirror.com
          BUILD_TARGET: tools
        strategy:
          retry: "0"
          timeout: 10
          resource:
            cpu: "4"
            memory: "8"
  - name: deploy
    displayName: Deploy to VPS
    strategy: naturally
    trigger: auto
    steps:
      - step: custom-build@custom
        name: deploy-vps
        displayName: Pull CCR images and deploy
        commands:
          - |
            set +x
            export DEPLOY_SSH_KEY='${DEPLOY_SSH_KEY}'
            bash deploy/gitee-deploy.sh
        strategy:
          retry: "0"
          timeout: 20
          resource:
            cpu: "2"
            memory: "4"
triggers:
  trigger: manual
