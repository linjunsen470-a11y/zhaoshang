# Public TCP 443 is owned by HAProxy, which must route the exact SNI
# jinyifangchan.com to its existing wushi_https backend (PROXY protocol).
# Without /var/www/jinyi-website/public-enabled, both site entries return 404.
server {
    listen 80;
    listen [::]:80;
    server_name jinyifangchan.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        if (!-f /var/www/jinyi-website/public-enabled) { return 404; }
        return 301 https://jinyifangchan.com$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name jinyifangchan.com;

    ssl_certificate /etc/letsencrypt/live/jinyifangchan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jinyifangchan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    if (!-f /var/www/jinyi-website/public-enabled) { return 404; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;

    # The company homepage and its bundled assets are served by Next.js.
    location = / {
        proxy_pass http://127.0.0.1:3300;
    }

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3300;
    }

    location = /index.html {
        return 301 https://jinyifangchan.com/$is_args$args;
    }

    # Preserve the published company pages and their assets.
    location ~ ^/(about\.html|services\.html|contact\.html|guide\.html|privacy\.html|css/style\.css|js/main\.js|images/[a-z][a-z-]*\.webp)$ {
        root /var/www/jinyi-website/current;
        try_files $uri =404;
    }

    location / { return 404; }
}
