# Public TCP 443 is owned by HAProxy, which must route the exact SNI
# jinyifangchan.com to its existing wushi_https backend (PROXY protocol).
# Without /var/www/jinyi-website/public-enabled, both site entries return 404.
server {
    listen 80;
    listen [::]:80;
    server_name jinyifangchan.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        if (!-f /var/www/jinyi-website/public-enabled) { return 404; }
        return 301 https://jinyifangchan.com$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name jinyifangchan.com;

    ssl_certificate /etc/letsencrypt/live/jinyifangchan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jinyifangchan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/jinyi-website/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    location / {
        if (!-f /var/www/jinyi-website/public-enabled) { return 404; }
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
