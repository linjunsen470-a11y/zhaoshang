# Explicit IPv4 host for the company site. This is a public HTTP entry;
# it does not change the routing of the other domains on this server.
server {
    listen 80;
    listen [::]:80;
    server_name 134.175.44.80;

    root /var/www/jinyi-website/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
