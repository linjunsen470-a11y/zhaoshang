# Private preview only. Reach through an authenticated SSH tunnel.
server {
    listen 127.0.0.1:18081;
    server_name jinyifangchan.com localhost;
    root /var/www/jinyi-website/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag noindex always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
