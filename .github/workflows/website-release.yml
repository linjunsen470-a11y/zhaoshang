name: Release the business website
on:
  workflow_dispatch:
    inputs:
      base_image:
        description: Current application image ID confirmed by the website connection check
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: production-website
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: tencent-test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build the website bundle
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/website"
          mkdir -p "$target/bundle"
          mapfile -t assets < website/public-files.txt
          git archive HEAD -- website/public-files.txt "${assets[@]/#/website/}" \
            deploy/website/{activate.sh,replace-app.sh,nginx-public.conf,source-manifest.mjs} | tar xf - -C "$target"
          (cd backend && node ../deploy/website/source-manifest.mjs) > "$target/source.manifest"
          docker build --target builder -t jinyi-website-builder backend
          container=$(docker create jinyi-website-builder)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/.next/standalone/.next" "$target/bundle/.next"
          docker cp "$container:/app/.next/static" "$target/bundle/.next/static"
          docker cp "$container:/app/.next/standalone/server.js" "$target/bundle/server.js"
          tar -C "$target" -czf "$RUNNER_TEMP/website.tgz" bundle deploy website source.manifest
      - name: Switch the website
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          set -euo pipefail
          [[ "$BASE_IMAGE" =~ ^sha256:[0-9a-f]{64}$ && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          unset SSH_KEY
          ssh=(ssh -F /dev/null -T -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15
            -o ServerAliveInterval=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/known_hosts ubuntu@134.175.44.80)
          remote=$("${ssh[@]}" mktemp -d /tmp/jinyi-website-XXXXXXXX)
          [[ "$remote" =~ ^/tmp/jinyi-website-[a-zA-Z0-9]{8}$ ]]
          trap '"${ssh[@]}" rm -rf -- "$remote"; rm -f "$key"' EXIT
          tar -C "$RUNNER_TEMP/website" -czf - source.manifest deploy/website/{replace-app.sh,source-manifest.mjs} |
            "${ssh[@]}" tar xzf - -C "$remote"
          "${ssh[@]}" sudo -n bash "$remote/deploy/website/replace-app.sh" "$GITHUB_SHA" "$BASE_IMAGE" --check
          archive="$RUNNER_TEMP/website.tgz"
          digest=$(sha256sum "$archive" | cut -d' ' -f1)
          "${ssh[@]}" "cat > '$remote/website.tgz'" < "$archive"
          "${ssh[@]}" bash -s -- "$remote" "$digest" "$GITHUB_SHA" "$BASE_IMAGE" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          printf '%s  website.tgz\n' "$2" | sha256sum -c -
          tar -xzf website.tgz
          sudo -n bash deploy/website/replace-app.sh "$3" "$4"
          REMOTE
      - name: Verify the public website
        shell: bash
        run: |
          set -euo pipefail
          origin=https://jinyifangchan.com
          node --input-type=module -e "import { checkHomepage } from './deploy/website/check-homepage.mjs'; await checkHomepage(process.argv[1])" "$origin/"
          cd "$RUNNER_TEMP"
          while IFS= read -r page; do
            [[ $page != index.html ]] || continue
            curl -fsS --max-time 15 "$origin/$page" -o page
            cmp "website/website/$page" page
          done < website/website/public-files.txt
          echo 'Verified public HTTPS, mini-program name, ICP link, photographs, logo, stylesheet and company pages'
