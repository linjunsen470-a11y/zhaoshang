name: Mini-program E2E

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        type: choice
        options: [smoke, full]
        default: smoke

jobs:
  devtools-e2e:
    runs-on: [self-hosted, Windows, wechat-devtools]
    timeout-minutes: 30
    env:
      MP_E2E_MODE: launch
      MP_E2E_CLI_PATH: ${{ vars.MP_E2E_CLI_PATH }}
      MP_E2E_API_URL: ${{ vars.MP_E2E_API_URL }}
      MP_E2E_ARTIFACT_DIR: test-results/mp-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run selected suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results/mp-e2e | Out-Null
          if ('${{ github.event.inputs.suite }}' -eq 'full') {
            pnpm test:mp:full:junit
          } else {
            pnpm test:mp:smoke:junit
          }
      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp-e2e-${{ github.run_id }}
          path: test-results/mp-e2e
          if-no-files-found: ignore
          retention-days: 14
