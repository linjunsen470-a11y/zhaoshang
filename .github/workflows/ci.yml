name: Manual code checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm test:ci
      - run: pnpm --dir backend test:cms
      - run: pnpm backend:lint
      - run: pnpm --dir backend exec tsc --noEmit
      - name: Check deployment scripts
        run: |
          bash -n deploy/deploy.sh deploy/gitee-deploy.sh deploy/check.sh deploy/tencent-test/backup.sh
          shellcheck deploy/deploy.sh deploy/gitee-deploy.sh deploy/check.sh deploy/tencent-test/backup.sh
