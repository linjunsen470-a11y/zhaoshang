name: Website connection check
on: workflow_dispatch
permissions:
  contents: read
concurrency: production-website
jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: tencent-test
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect or retire the dedicated website resources
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu
          [[ -n "$SSH_KEY" ]] || { echo 'No DEPLOY_SSH_KEY available to this website check'; exit 1; }
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          unset SSH_KEY
          ssh -F /dev/null -T -p 22 -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/known_hosts \
            ubuntu@134.175.44.80 bash -s <<'REMOTE'
          set -euo pipefail
          echo 'Shared HTTPS router'
          sudo -n awk '/^frontend shared_https/{p=1} p && /^backend /{exit} p{print}' /etc/haproxy/haproxy.cfg
          echo 'Project certificate subjects'
          sudo -n openssl x509 -in /etc/letsencrypt/live/jinyifangchan.com/fullchain.pem -noout -ext subjectAltName
          sudo -n test -f /etc/letsencrypt/renewal/jinyifangchan.com.conf
          echo 'PM2 dedicated website process count'
          sudo -n python3 - <<'PY'
          from pathlib import Path
          import json
          for f in [Path('/home/ubuntu/.pm2/dump.pm2'),Path('/root/.pm2/dump.pm2')]:
           if f.exists():
            apps=json.loads(f.read_text())
            for a in apps:
             fields=[str(a.get(k,'')) for k in ('name','pm_exec_path','pm_cwd')]
             dedicated=any('jinyi-website' in x or 'jinyifangchan.com' in x for x in fields)
             print('website-specific' if dedicated else 'other',a.get('name'), 'cwd', a.get('pm_cwd'))
          PY
          echo 'Dedicated files in the active site directory'
          sudo -n find /var/www/jinyi-website -mindepth 1 -maxdepth 1 -printf '%f %y\n'
          echo 'Origin status with pinned domain'
          for host in api.cqwushi.com api.jinyifangchan.com; do
            curl -fsS --noproxy '*' --resolve "$host:443:127.0.0.1" "https://$host/api/projects?limit=1" -o /dev/null
          done
          REMOTE
