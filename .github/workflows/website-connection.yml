name: Website connection check
on: workflow_dispatch
permissions:
  contents: read
concurrency: production-website
jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: tencent-test
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect or retire the dedicated website resources
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu
          [[ -n "$SSH_KEY" ]] || { echo 'No DEPLOY_SSH_KEY available to this website check'; exit 1; }
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          unset SSH_KEY
          ssh -F /dev/null -T -p 22 -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/known_hosts \
            ubuntu@134.175.44.80 bash -s <<'REMOTE'
          set -euo pipefail
          hostname
          sudo -n nginx -t
          sudo -n haproxy -c -f /etc/haproxy/haproxy.cfg
          sudo -n ls -l /etc/nginx/sites-enabled/ /etc/nginx/sites-available/ /etc/nginx/conf.d/
          sudo -n grep -nE '(^[[:space:]]*(frontend|backend|bind|default_backend|use_backend|acl) |jinyi)' /etc/haproxy/haproxy.cfg
          for file in /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*.conf; do
            [[ -f "$file" ]] || continue
            echo "$file"
            sudo -n grep -E '^[[:space:]]*(listen|server_name|root|proxy_pass|ssl_certificate) ' "$file" | sed -E 's!://[^/@ ]+@!://***@!g' || true
          done
          sudo -n docker ps -a --format '{{.Names}} {{.Ports}} {{.Status}}'
          sudo -n ss -lntp | awk 'NR>1 {print $4,$6}'
          systemctl list-unit-files --type=service,timer,socket --no-pager | grep -Ei 'jinyi|website|nginx|haproxy|certbot|pm2' || true
          sudo -n grep -rilE 'jinyi-website|jinyifangchan\.com' /etc/nginx /etc/haproxy /etc/systemd/system /etc/cron.d /etc/letsencrypt/renewal /etc/letsencrypt/renewal-hooks --exclude='*.pem' 2>/dev/null || true
          sudo -n ls -lad /var/www/jinyi* /var/backups/jinyi* /etc/letsencrypt/live/* || true
          REMOTE
