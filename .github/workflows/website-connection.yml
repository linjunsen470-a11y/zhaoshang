name: Website connection check
on: workflow_dispatch
permissions:
  contents: read
concurrency: production-website
jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: tencent-test
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect or retire the dedicated website resources
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu
          [[ -n "$SSH_KEY" ]] || { echo 'No DEPLOY_SSH_KEY available to this website check'; exit 1; }
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          unset SSH_KEY
          ssh -F /dev/null -T -p 22 -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/known_hosts \
            ubuntu@134.175.44.80 bash -s <<'REMOTE'
          set -euo pipefail
          sudo -n bash -s <<'RETIRE'
          set -Eeuo pipefail
          umask 077
          exec 9>/run/lock/retire-jinyi-website.lock
          flock -n 9
          domain=jinyifangchan.com
          webroot=/var/www/jinyi-website
          deny=/etc/nginx/sites-available/jinyi-retired.conf
          deny_link=/etc/nginx/sites-enabled/jinyi-retired.conf
          router=/etc/haproxy/haproxy.cfg
          names=(jinyi-website-ip.conf jinyi-website-preview.conf jinyi-website-public.conf)
          backup=$(mktemp -d /var/backups/jinyi-website/retired-XXXXXXXX)
          echo "Private rollback directory: $backup"
          assets=(etc/haproxy/haproxy.cfg)
          for name in "${names[@]}"; do
            test "$(readlink -f "/etc/nginx/sites-enabled/$name")" = "/etc/nginx/sites-available/$name"
            assets+=("etc/nginx/sites-enabled/$name" "etc/nginx/sites-available/$name")
          done
          for item in "archive/$domain" "live/$domain" "renewal/$domain.conf"; do
            assets+=("etc/letsencrypt/$item")
          done
          test -d "$webroot" && test ! -L "$webroot" && test -f "$webroot/public-enabled"
          test ! -e "$deny"
          test ! -e "$deny_link" && test ! -L "$deny_link"
          san=$(openssl x509 -in "/etc/letsencrypt/live/$domain/cert.pem" -noout -ext subjectAltName | tail -n +2 | xargs)
          [[ "$san" = "DNS:$domain" ]]
          nginx -t
          haproxy -c -f "$router"
          tar -czf "$backup/config.tar.gz" -C / "${assets[@]}"
          tar -dzf "$backup/config.tar.gz" -C /
          nginx -T >"$backup/nginx.before" 2>&1
          cp -a "$router" "$backup/haproxy.next"
          python3 - "$backup/haproxy.next" <<'PY'
          from pathlib import Path
          import sys
          f=Path(sys.argv[1])
          lines=f.read_text().splitlines(keepends=True)
          def index(s):
              found=[i for i,l in enumerate(lines) if l.strip()==s]
              if len(found)!=1: raise ValueError('Unexpected shared frontend configuration')
              return found[0]
          front=index('frontend shared_https')
          accept=index('tcp-request content accept if { req.ssl_hello_type 1 }')
          acl=index('acl jinyi_site req.ssl_sni -i jinyifangchan.com')
          use=index('use_backend wushi_https if jinyi_site')
          default=index('default_backend existing_reality')
          assert front < accept < acl < use < default
          assert sum('jinyi_site' in line for line in lines)==2
          lines[acl]=lines[use]=''
          lines.insert(accept,'    tcp-request content reject if { req.ssl_sni -i jinyifangchan.com }\n')
          f.write_text(''.join(lines))
          PY
          haproxy -c -f "$backup/haproxy.next"
          pinned() { local host=$1; shift; curl -sS --noproxy '*' --max-time 12 --resolve "$host:443:127.0.0.1" "$@"; }
          check_apis() {
            for h in api.cqwushi.com api.jinyifangchan.com; do
              pinned "$h" -f "https://$h/api/projects?limit=1" | python3 -c 'import json,sys; assert isinstance(json.load(sys.stdin).get("docs"), list)'
              pinned "$h" -f -o /dev/null "https://$h/admin/login"
              [[ "$(pinned "$h" -o /dev/null -w '%{http_code}' "https://$h/api/profile")" = 401 ]]
            done
          }
          check_apis
          other_status=$(pinned cqwushi.com -o /dev/null -w '%{http_code}' https://cqwushi.com/)
          before_containers=$(docker ps --format '{{.Names}} {{.ID}}' | sort)
          rollback() {
            result=$?
            trap - EXIT HUP INT TERM
            if [[ "$result" != 0 ]]; then
              echo 'Restoring the previous website configuration'
              set +e
              rm -f -- "$deny" "$deny_link"
              tar -xzf "$backup/config.tar.gz" -C /
              if [[ -d "$backup/site" && ! -e "$webroot" ]]; then mv "$backup/site" "$webroot"; fi
              nginx -t && systemctl reload nginx
              haproxy -c -f "$router" && systemctl reload haproxy
            fi
            exit "$result"
          }
          trap rollback EXIT
          trap 'exit 1' HUP INT TERM
          cat > "$deny" <<'NGINX'
          # Refuse stale HTTP requests on this shared origin.
          server {
              listen 80;
              listen [::]:80;
              server_name jinyifangchan.com 134.175.44.80;
              return 410;
          }
          NGINX
          chmod 644 "$deny"
          ln -s "$deny" "$deny_link"
          for name in "${names[@]}"; do
            rm -- "/etc/nginx/sites-enabled/$name" "/etc/nginx/sites-available/$name"
          done
          install -o root -g root -m "$(stat -c %a "$router")" "$backup/haproxy.next" "$router"
          nginx -t
          haproxy -c -f "$router"
          systemctl reload haproxy
          systemctl reload nginx
          for _ in {1..12}; do
            if ! ss -H -lnt 'sport = :18081' | grep -q .; then break; fi
            sleep 1
          done
          [[ -z "$(ss -H -lnt 'sport = :18081')" ]]
          for h in "$domain" 134.175.44.80; do
            [[ "$(curl -sS --noproxy '*' --max-time 8 -o /dev/null -w '%{http_code}' -H "Host: $h" http://127.0.0.1/)" = 410 ]]
          done
          if pinned "$domain" -k -o /dev/null "https://$domain/"; then echo 'Retired HTTPS hostname still served'; exit 1; fi
          check_apis
          [[ "$other_status" = "$(pinned cqwushi.com -o /dev/null -w '%{http_code}' https://cqwushi.com/)" ]]
          [[ "$before_containers" = "$(docker ps --format '{{.Names}} {{.ID}}' | sort)" ]]
          nginx -T > "$backup/nginx.after" 2>&1
          if grep -Fq "/etc/letsencrypt/live/$domain/" "$backup/nginx.after" || grep -Fq "$webroot" "$backup/nginx.after"; then exit 1; fi
          mv "$webroot" "$backup/site"
          certbot delete --cert-name "$domain" --non-interactive
          test ! -e "/etc/letsencrypt/renewal/$domain.conf"
          for h in api.cqwushi.com api.jinyifangchan.com; do test -f "/etc/letsencrypt/renewal/$h.conf"; done
          nginx -t
          haproxy -c -f "$router"
          check_apis
          trap - EXIT HUP INT TERM
          echo 'Retired website HTTP, IP, TLS, preview, site files and certificate renewal. Both APIs and shared services passed.'
          RETIRE
          REMOTE
