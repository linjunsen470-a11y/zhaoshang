  <style data-source="css/style.css">
* { box-sizing: border-box; }

:root {
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  color: #172a27;
  background: #f6f8f6;
  line-height: 1.7;
}

body { margin: 0; }
a { color: #175d50; }
a:hover { color: #0d4037; }
a:focus-visible { outline: 3px solid #cfad5d; outline-offset: 4px; }
.container { width: min(1100px, calc(100% - 48px)); margin: 0 auto; }
.skip-link { position: absolute; top: -80px; left: 12px; z-index: 5; padding: 8px 14px; background: #fff; }
.skip-link:focus { top: 12px; }

.site-header { border-bottom: 1px solid #e0e8e2; background: #fff; }
.header-inner { min-height: 92px; display: flex; align-items: center; justify-content: space-between; gap: 26px; }
.brand { display: flex; align-items: center; gap: 12px; color: #173c34; font-size: 16px; font-weight: 700; line-height: 1.35; text-decoration: none; }
.brand small { display: block; margin-top: 3px; color: #687d74; font-size: 10px; font-weight: 600; letter-spacing: .12em; }
.brand-mark { display: grid; width: 42px; height: 42px; flex: 0 0 42px; place-items: center; border-radius: 8px; background: #1c594c; color: #fff; font-size: 22px; }
.navigation { display: flex; flex-wrap: wrap; gap: 6px 24px; }
.navigation a { padding: 8px 0; color: #4b5f58; font-size: 14px; text-decoration: none; white-space: nowrap; }
.navigation a:hover, .navigation a[aria-current="page"] { color: #175d50; }
.navigation a[aria-current="page"] { font-weight: 700; }

.main-content { min-height: calc(100vh - 240px); padding: 78px 0 90px; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, .9fr); align-items: center; gap: 72px; padding: 32px 0; }
.eyebrow { margin: 0 0 14px; color: #467366; font-size: 12px; font-weight: 700; letter-spacing: .1em; }
h1, h2, p { margin-top: 0; }
h1 { margin-bottom: 20px; color: #163e35; font-size: clamp(32px, 4vw, 46px); line-height: 1.25; letter-spacing: -.03em; }
h2 { color: #203d35; font-size: 19px; line-height: 1.45; }
.lead { max-width: 600px; margin-bottom: 0; color: #4c6259; font-size: 17px; }
.hero-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; margin-top: 32px; }
.button { display: inline-block; padding: 10px 22px; border-radius: 6px; background: #1c594c; color: #fff; font-size: 14px; font-weight: 600; text-decoration: none; }
.button:hover { background: #14483d; color: #fff; }
.text-link { font-size: 14px; font-weight: 600; text-decoration: none; }

.company-card, .information-card, .service-item { border: 1px solid #e0e8e2; border-radius: 10px; background: #fff; }
.company-card { padding: 30px; box-shadow: 0 12px 36px rgba(30, 64, 52, .05); }
.company-card h2 { margin-bottom: 24px; }
.company-card dl, .information-card dl { margin: 0; }
.company-card dl div, .information-card dl div { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 18px; padding: 15px 0; border-top: 1px solid #edf1ee; }
dt { color: #677a71; font-size: 14px; }
dd { min-width: 0; margin: 0; color: #263d35; font-size: 14px; overflow-wrap: anywhere; }
dd a, .footer-inner a { text-decoration: none; }
.page-heading { max-width: 700px; margin-bottom: 38px; }
.information-card { max-width: 820px; padding: 12px 28px 24px; }
.information-card dl div { padding: 22px 0; }
.information-card dl div:first-child { border-top: 0; }
.service-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.service-item { padding: 28px; }
.service-item h2 { margin-bottom: 12px; }
.service-item p { margin-bottom: 0; color: #586d62; font-size: 15px; }

.site-footer { padding: 24px 0; border-top: 1px solid #e0e8e2; background: #fff; }
.footer-inner { color: #687b71; font-size: 13px; text-align: center; }
.footer-inner p { margin: 3px 0; }
.icp-badge:empty { display: none; }

@media (max-width: 760px) {
  .container { width: calc(100% - 32px); }
  .header-inner { align-items: flex-start; flex-direction: column; gap: 10px; padding: 18px 0 12px; }
  .brand { font-size: 14px; }
  .navigation { gap: 4px 22px; }
  .main-content { min-height: 0; padding: 48px 0 60px; }
  .hero { grid-template-columns: 1fr; gap: 36px; padding: 0; }
  .company-card { padding: 24px; }
  .service-list { grid-template-columns: 1fr; }
}

@media (max-width: 420px) {
  .company-card dl div, .information-card dl div { grid-template-columns: 1fr; gap: 4px; }
  .information-card { padding: 8px 20px 20px; }
}
  </style>
