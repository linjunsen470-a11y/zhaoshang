<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>业务介绍 - 广州锦奕咨询服务有限公司</title>
  <meta name="description" content="广州锦奕咨询服务有限公司提供商业空间招商、商户选址及商用设备转让相关咨询。">
  <style data-source="css/style.css">
* { box-sizing: border-box; }
:root {
  color-scheme: light;
  --ink: #1c392f;
  --body: #46564c;
  --rule: #d4d7ca;
  --serif: "Songti SC", "Noto Serif CJK SC", "STSong", "SimSun", serif;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink); background: #f9f8f3; line-height: 1.8;
}
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
.container { width: min(1264px, 88%); margin-inline: auto; }
a { color: inherit; text-underline-offset: 4px; }
a:focus-visible { outline: 2px solid #a46831; outline-offset: 4px; }
.skip-link { position: absolute; top: -70px; left: 12px; background: white; padding: 8px; }
.skip-link:focus { top: 8px; }
.header-inner { min-height: 88px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--rule); }
.brand { display: inline-flex; gap: 6px; align-items: baseline; text-decoration: none; }
.brand-mark { font: 600 29px/1.2 var(--serif); letter-spacing: .04em; }
.brand small { font: 600 10px/1.2 Georgia, serif; letter-spacing: .1em; }
.navigation { display: flex; align-items: center; flex-wrap: wrap; gap: 4px clamp(16px, 3vw, 40px); }
.navigation a { font-size: 14px; text-decoration: none; }
.navigation a:hover, .navigation a[aria-current="page"] { text-decoration: underline; text-underline-offset: 6px; }
.main-content { flex: 1; padding-block: clamp(45px, 6vw, 96px); }
h1, h2, p, dl, dd { margin: 0; }
h1, h2 { font-family: var(--serif); font-weight: 500; line-height: 1.38; }
h1 { font-size: clamp(38px, 4.6vw, 66px); }
h2 { font-size: 22px; }
.lead, .hero p, .service-item p, dd { color: var(--body); }
.lead { font-size: 17px; max-width: 38em; margin-top: 16px; }
.hero { display: grid; grid-template-columns: 1.1fr 1fr; align-items: start; gap: 8%; }
.eyebrow { margin-bottom: 14px; font-size: 13px; letter-spacing: .06em; }
.hero .lead { margin-bottom: 12px; }
.hero-actions { display: flex; gap: 20px; align-items: center; margin-top: 25px; font-size: 14px; }
.button { padding: 8px 18px; background: var(--ink); border-radius: 3px; color: white; text-decoration: none; }
.page-heading { margin-bottom: 36px; }
.company-card, .information-card, .service-list { border-top: 1px solid var(--rule); }
.company-card { padding-top: 20px; }
.company-card h2 { margin-bottom: 14px; }
.information-card { max-width: 880px; }
dl div { display: grid; grid-template-columns: 135px 1fr; gap: 22px; padding: 18px 0; border-bottom: 1px solid var(--rule); }
dt { color: #626c61; font-size: 14px; }
dd { overflow-wrap: anywhere; }
.service-list { display: grid; grid-template-columns: 1fr 1fr; column-gap: 6%; }
.service-item { border-bottom: 1px solid var(--rule); padding-block: 24px; }
.service-item p { margin-top: 8px; }
.site-footer { padding: 22px 0; border-top: 1px solid var(--rule); background: #edf0e7; }
.footer-inner { text-align: center; color: #4e6053; font-size: 12px; }
.footer-inner p { margin: 2px 0; }
.footer-inner a { text-decoration: none; }
.footer-inner a:hover { text-decoration: underline; }
@media (max-width: 650px) {
  .container { width: calc(100% - 40px); }
  .header-inner { min-height: 70px; flex-wrap: wrap; padding: 12px 0; gap: 8px 14px; }
  .brand-mark { font-size: 25px; }
  .navigation { gap: 5px 13px; }
  .navigation a { font-size: 13px; }
  .hero, .service-list { grid-template-columns: 1fr; }
  .hero { row-gap: 34px; }
  .page-heading { margin-bottom: 23px; }
  dl div { grid-template-columns: 1fr; gap: 3px; padding: 14px 0; }
}
  </style>
</head>

        </section>

        </section>
        <section class="service-item">

        </section>
      </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="current-year">2026</span> 广州锦奕咨询服务有限公司</p>

  </footer>
