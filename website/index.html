:root {
  color-scheme: light;
  --paper: #f9f8f4;
  --ink: #19392d;
  --body: #46594c;
  --rule: #cdd2c5;
  --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", STSong, SimSun, serif;

  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  color: var(--ink); background: var(--paper);
}
* { box-sizing: border-box; }
body { max-width: 1920px; margin: 0 auto; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 5px; }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid #ad773b; outline-offset: 4px; }
h1, h2, h3, p, dl, dd, figure { margin: 0; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; text-wrap: balance; }
h1 { font-size: clamp(44px, 5vw, 82px); line-height: 1.22; }
h2 { font-size: clamp(28px, 2.6vw, 44px); line-height: 1.36; }
h3 { font-size: clamp(20px, 1.55vw, 26px); }
p, dd { line-height: 1.9; color: var(--body); }
p { font-size: 16px; }
img { display: block; max-width: 100%; }
.inner { width: min(1160px, 88%); margin-inline: auto; }
[id] { scroll-margin-top: 22px; }
.skip-link { position: absolute; top: -70px; left: var(--edge); z-index: 4; background: white; padding: 8px; }
.skip-link:focus { top: 8px; }
.site-header { min-height: clamp(68px, 6.5vw, 94px); margin-inline: var(--edge); display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.brand img { width: clamp(78px, 6.5vw, 100px); height: auto; }
.navigation { display: flex; gap: clamp(17px, 2.5vw, 42px); }

.navigation a[aria-current="page"] { text-decoration: underline; text-underline-offset: 6px; }
.site-footer {
  display: grid;
  justify-items: center;
  gap: 4px;
  margin-inline: var(--edge);
  padding: 18px 0 22px;
  border-top: 1px solid var(--rule);
  color: #586459;
  font-size: 13px;
  line-height: 1.6;
  text-align: center;
}
.filing-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 24px; }
.filing-links a { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; white-space: nowrap; }
.filing-links img { display: block; width: auto; height: 20px; }
@media (max-width: 480px) {

.text-link span { margin-left: 8px; }
.text-link:hover { text-decoration: none; border-bottom-color: var(--ink); }

.service-opening { position: relative; isolation: isolate; display: flex; align-items: end; min-height: clamp(360px, 36vw, 560px); margin-inline: var(--edge); color: #fffdf6; background: #464939; }
.service-opening img, .service-opening::before { position: absolute; inset: 0; width: 100%; height: 100%; }
.service-opening img { z-index: -2; object-fit: cover; object-position: 50% 40%; }

dt { font-size: 14px; line-height: 1.85; }

.registration .rows div { grid-template-columns: minmax(98px, .42fr) 1fr; }
.contact-layout { display: grid; grid-template-columns: .95fr 1.1fr; margin-inline: var(--edge); background: #e8ecdf; }
.contact-panel { padding: clamp(28px, 4.5vw, 78px); align-self: center; }
.contact-photo { width: 100%; height: 100%; min-height: 0; object-fit: cover; }
.contact-block { margin-top: 26px; }
.contact-block + .contact-block { border-top: 1px solid #b6c1ae; padding-top: 22px; }
.contact-block h2 { font-size: clamp(22px, 2vw, 30px); }
.contact-block p { margin-top: 8px; font-size: 15px; }
.copy-name { display: inline-block; margin-top: 12px; min-height: 44px; padding: 8px 17px; background: var(--ink); color: white; border: 0; border-radius: 3px; cursor: pointer; font: inherit; font-size: 14px; }
[hidden] { display: none; }
.copy-state { display: inline-block; color: var(--body); font-size: 13px; margin-left: 8px; }
.phone { display: inline-block; margin-top: 8px; font: 500 clamp(24px, 2.5vw, 38px)/1.45 Georgia, serif; letter-spacing: .025em; }
.phone span { font-size: .62em; }
.address { border-top: 1px solid var(--rule); padding: 20px 0 40px; display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; color: var(--body); line-height: 1.8; }
@media (max-width: 760px) {
  .inner { width: calc(100% - 40px); }
  .about-lead, .chapter, .registration, .meal-feature { grid-template-columns: 1fr; gap: 18px; }
  .about-lead { padding-block: 24px; }
  .about-lead .intro { margin-top: 12px; }
  .service-opening { min-height: clamp(345px, 68vw, 440px); }
  .topic-nav { padding-block: 16px; }
  .chapter { padding-block: 34px; }
  .meal-feature { gap: 0; }
  .meal-photo img { height: auto; aspect-ratio: 1.9; }
  .meal-copy { padding: 26px; }
  .meal-copy p { margin-top: 12px; }
  .registration { padding-block: 26px 36px; }
  .team-photo { width: calc(100% - 2 * var(--edge)); }
  .contact-layout { grid-template-columns: 1fr; padding: 22px; }
  .contact-panel { display: contents; }
  .contact-layout h1 { grid-row: 1; margin-bottom: 16px; }
  .contact-photo { grid-row: 2; height: auto; aspect-ratio: 2; }
  .contact-block { margin-top: 20px; }
}
@media (max-width: 500px) {
  .small-pair { grid-template-columns: 1fr; gap: 19px; }
  .rows div { grid-template-columns: 76px 1fr; gap: 10px; }
  .navigation { gap: 13px; }
  .navigation a { font-size: 13px; }
}
